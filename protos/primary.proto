syntax = "proto3";

// Shared types
message Point {
    double x = 1;
    double y = 2;
}

message Color {
    double r = 1;
    double g = 2;
    double b = 3;
}

message DrawPath {
    repeated Point points = 1;
    Color color = 2;
}

message Arrow {
    Point start = 1;
    Point end = 2;
    Color color = 3;
}

message Icon {
    message TeamOperator {
        uint32 teammate_idx = 1;
    }
    message TeamAbility {
        uint32 teammate_idx = 1;
    }
    message TeamUtility {
        uint32 teammate_idx = 1;
    }
    message FreeOperator {
        string operator = 1;
    }
    message FreeAbility {
        string ability = 1;
    }
    message FreeUtility {
        string util = 1;
    }

    Point pos = 1;
    oneof IconKind {
        TeamOperator team_operator = 11;
        TeamAbility team_ability = 12;
        TeamUtility team_utility = 13;
        FreeOperator free_operator = 14;
        FreeAbility free_ability = 15;
        FreeUtility free_utility = 16;
    }
}
message StratFloor {
    map<string, DrawPath> draw_paths = 1;
    map<string, Arrow> arrows = 2;
    map<string, Icon> icons = 3;
}

message StratPhase {
    string phase_name = 1;
    repeated StratFloor floors = 2;
}

message Teammate {
    string operator = 1;
    Color color = 2;
    string util = 3;
}

message StratState {
    string strat_name = 1;
    repeated StratPhase phases = 2;
    repeated Teammate teammates = 3;
}

// Hello
message Hello {}

message HelloResponse {}

// LoginRequest
message LoginRequest {
    string username = 1;
}
message LoginResponse {}

// GetStratList
message GetStratList {}

message GetStratListResponseEntry {
    string strat_id = 1;
    string strat_name = 2;
    string map = 3;
}

message GetStratListResponse {
    repeated GetStratListResponseEntry strats = 1;
}

// CreateEmptyStrat
message CreateEmptyStrat {
    string map = 1;
}

message CreateEmptyStratResponse {
    string strat_id = 1;
}

// GetMapMetadata
message GetMapMetadata {
    string map = 1;
}

message GetMapMetadataResponse {
    repeated string floors = 1;
}

// GetStratInfo
message GetStratInfo {
    string strat_id = 1;
}

message GetStratInfoResponse {
    StratState state = 1; 
}

// SaveStrat
message SaveStrat {
    string strat_id = 1;
    StratState state = 2;
}

message SaveStratResponse {}

// CreateLobby
message CreateLobby {}

message CreateLobbyResponse {}

// GetLobbyList
message GetLobbyList {}

message GetLobbyListResponse {
    message LobbyInfo {
        string id = 1;
        string host_name = 2;
    }
    repeated LobbyInfo lobbies = 1;
}

// UpdateLobbyMembers
message UpdateLobbyMembers {
    repeated string members = 1;
}

// JoinLobby
message JoinLobby {
    string id = 1;
}

message JoinLobbyResponse {}

// UpdateLobbyStratList
message UpdateLobbyStratList {
    message LobbyStratInfo {
        string strat_id = 1;
        string strat_name = 2;
        string author_name = 3;
        string map = 4;
    }
    repeated LobbyStratInfo strats = 1; 
}

// LobbyLoadStrat
message LobbyLoadStrat {
    string strat_id = 1;
}

// LobbySetCurrentStrat
message LobbySetCurrentStrat {
    string strat_id = 1;
    string map = 2;
}

message Client2Server {
    oneof C2SInner {
        Hello hello = 1;
        LoginRequest login_request = 2;
        GetStratList get_strat_list = 3;
        CreateEmptyStrat create_empty_strat = 4;
        GetMapMetadata get_map_metadata = 5;
        GetStratInfo get_strat_info = 6;
        SaveStrat save_strat = 7;

        CreateLobby create_lobby = 101;
        GetLobbyList get_lobby_list = 102;
        JoinLobby join_lobby = 104;
        LobbyLoadStrat lobby_load_strat = 106;
    }
}

message Server2Client {
    oneof S2CInner {
        HelloResponse hello_response = 1;
        LoginResponse login_response = 2;
        GetStratListResponse get_strat_list_response = 3;
        CreateEmptyStratResponse create_empty_strat_response = 4;
        GetMapMetadataResponse get_map_metadata_response = 5;
        GetStratInfoResponse get_strat_info_response = 6;
        SaveStratResponse save_strat_response = 7;

        CreateLobbyResponse create_lobby_response = 101;
        GetLobbyListResponse get_lobby_list_response = 102;
        UpdateLobbyMembers update_lobby_members = 103;
        JoinLobbyResponse join_lobby_response = 104;
        UpdateLobbyStratList update_lobby_strat_list = 105;
        LobbySetCurrentStrat lobby_set_current_strat = 106;
    }
}
