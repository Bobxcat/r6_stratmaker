syntax = "proto3";

// Shared types
message Point {
    double x = 1;
    double y = 2;
}

message Color {
    double r = 1;
    double g = 2;
    double b = 3;
}

message DrawPath {
    repeated Point points = 1;
    Color color = 2;
}

message Arrow {
    Point start = 1;
    Point end = 2;
    Color color = 3;
}

message Icon {
    message TeamOperator {
        uint32 teammateIdx = 1;
    }
    message TeamAbility {
        uint32 teammateIdx = 1;
    }
    message TeamUtility {
        uint32 teammateIdx = 1;
    }
    message FreeOperator {
        string operator = 1;
    }
    message FreeAbility {
        string ability = 1;
    }
    message FreeUtility {
        string util = 1;
    }

    Point pos = 1;
    oneof IconKind {
        TeamOperator teamOperator = 11;
        TeamAbility teamAbility = 12;
        TeamUtility teamUtility = 13;
        FreeOperator freeOperator = 14;
        FreeAbility freeAbility = 15;
        FreeUtility freeUtility = 16;
    }
}
message StratFloor {
    map<string, DrawPath> drawPaths = 1;
    map<string, Arrow> arrows = 2;
    map<string, Icon> icons = 3;
}

message StratPhase {
    string phase_name = 1;
    repeated StratFloor floors = 2;
}

message Teammate {
    string operator = 1;
    Color color = 2;
    string util = 3;
}

message StratState {
    string strat_name = 1;
    repeated StratPhase phases = 2;
    repeated Teammate teammates = 3;
}

// Hello
message Hello {}

message HelloResponse {}

// LoginRequest
message LoginRequest {
    string username = 1;
}
message LoginResponse {}

// GetStratList
message GetStratList {}

message GetStratListResponseEntry {
    string strat_id = 1;
    string strat_name = 2;
    string map = 3;
}

message GetStratListResponse {
    repeated GetStratListResponseEntry strats = 1;
}

// CreateEmptyStrat
message CreateEmptyStrat {
    string map = 1;
}

message CreateEmptyStratResponse {
    string strat_id = 1;
}

// GetMapMetadata
message GetMapMetadata {
    string map = 1;
}

message GetMapMetadataResponse {
    repeated string floors = 1;
}

// GetStratInfo
message GetStratInfo {
    string strat_id = 1;
}

message GetStratInfoResponse {
    StratState state = 1; 
}

// SaveStrat
message SaveStrat {
    string strat_id = 1;
    StratState state = 2;
}

message SaveStratResponse {}

// CreateLobby
message CreateLobby {}

message CreateLobbyResponse {}

// GetLobbyList
message GetLobbyList {}

message GetLobbyListResponse {
    repeated string hosts = 1;
}

// UpdateLobbyMembers
message UpdateLobbyMembers {
    repeated string members = 1;
}

// 

message Client2Server {
    oneof C2SInner {
        Hello hello = 1;
        LoginRequest loginRequest = 2;
        GetStratList getStratList = 3;
        CreateEmptyStrat createEmptyStrat = 4;
        GetMapMetadata getMapMetadata = 5;
        GetStratInfo getStratInfo = 6;
        SaveStrat saveStrat = 7;

        CreateLobby createLobby = 101;
        GetLobbyList getLobbyList = 102;
    }
}

message Server2Client {
    oneof S2CInner {
        HelloResponse helloResponse = 1;
        LoginResponse loginResponse = 2;
        GetStratListResponse getStratListResponse = 3;
        CreateEmptyStratResponse createEmptyStratResponse = 4;
        GetMapMetadataResponse getMapMetadataResponse = 5;
        GetStratInfoResponse getStratInfoResponse = 6;
        SaveStratResponse saveStratResponse = 7;

        CreateLobbyResponse createLobbyResponse = 101;
        GetLobbyListResponse getLobbyListResponse = 102;
        UpdateLobbyMembers updateLobbyMembers = 103;
    }
}
